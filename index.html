<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Complete - DTrader + DBot</title>
<style>
:root{--brand:#ff444f;--bg:#0e0e0e;--card:#1a1a1a;--border:#2e2e2e;--green:#4bb950}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--bg);color:#fff}
.header{height:56px;background:#151515;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.logo{color:var(--brand);font-weight:900;font-size:20px}
.modes{display:flex;gap:6px}
.mode{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:#222;cursor:pointer;font-size:13px;font-weight:700}
.mode.active{background:var(--brand);border-color:var(--brand)}
.layout{display:grid;grid-template-columns:300px 1fr 300px;height:calc(100vh - 56px)}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin:10px}
.label{font-size:10px;color:#999;text-transform:uppercase;margin-bottom:6px;display:block}
.input,select{width:100%;background:#0e0e0e;border:1px solid var(--border);border-radius:6px;padding:9px;color:#fff;margin-bottom:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tab{font-size:11px;padding:5px 8px;background:#222;border:1px solid var(--border);border-radius:4px;cursor:pointer}
.tab.active{background:#333;color:#fff;border-color:var(--brand)}
.btn{width:100%;padding:10px;border:none;border-radius:6px;font-weight:800;cursor:pointer;margin-top:6px}
.btn-green{background:var(--green);color:#fff}.btn-red{background:var(--brand);color:#fff}
.btn-dark{background:#2a2a2a;color:#fff;border:1px solid var(--border)}
.price{font-size:38px;font-weight:900;text-align:center;padding:16px}
canvas{width:100%;background:#0a0a0a;border:1px solid var(--border);border-radius:8px}
